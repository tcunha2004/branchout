[project]
name = "branchout"
version = "0.1.0"
description = "Agente de IA que recomenda uma área de tecnologia e monta um roadmap de estudos gratuito, do zero."
readme = "README.md"
authors = [
    { name = "tcunha2004", email = "tcunha2004@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "langchain>=1.5.2",
    "langchain-aws>=1.10.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.24",
]

[project.scripts]
branchout = "branchout.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
